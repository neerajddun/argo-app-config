apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: app.rules
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="myapp", pod=~"flask-app.*"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            description: "Pod {{ $labels.pod }} is crash-looping"
